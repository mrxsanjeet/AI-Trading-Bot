version: "3.8"

services:
  trading-bot:
    build: .
    container_name: ai-trading-bot
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
    command: python run.py --public --no-browser
    restart: unless-stopped
