version: "3.8"

services:
  trading-bot:
    build: .
    container_name: ai-trading-bot
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
    command: python -m src.main paper
    restart: unless-stopped

  dashboard:
    build: .
    container_name: ai-trading-dashboard
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
