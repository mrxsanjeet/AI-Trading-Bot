strategies:
  trend_following:
    enabled: true
    ema_short: 12
    ema_long: 26
    macd_signal: 9
    weight: 0.3

  mean_reversion:
    enabled: true
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    weight: 0.2

  momentum:
    enabled: true
    breakout_period: 20
    volume_multiplier: 1.5
    atr_period: 14
    weight: 0.2

  ml_strategy:
    enabled: true
    model_type: lstm
    confidence_threshold: 0.65
    weight: 0.3

  hybrid:
    enabled: false
    min_agreement: 2            # Minimum strategies that must agree
    weighted_voting: true
